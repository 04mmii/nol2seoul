<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOLSEOUL — 놀 서울, 에디토리얼 리디자인 v3</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet" />

<style>
/* NOLSEOUL — refined editorial system (v2)
   Type: one display sans (Space Grotesk / Pretendard 800 for Hangul),
   one mono for data, one italic serif reserved for quoted voice only.
   Color: night navy + off-white bone + sunset, accent used structurally. */

:root {
  --bone: #f6f2ea;
  --bone-2: #efe9dd;
  --sand: #ddd5c5;
  --ink: #14130f;
  --ink-2: #3d3931;
  --mute: #6b6559;
  --line: rgba(20, 19, 15, 0.16);
  --line-strong: rgba(20, 19, 15, 0.34);

  --tangerine: #e2542f;      /* sunset — fills, large type */
  --tangerine-deep: #b13c1b; /* sunset ink — small labels on bone */
  --night: #111d38;
  --night-2: #1b2a4c;
  --night-line: rgba(246, 242, 234, 0.18);
  --night-mute: rgba(246, 242, 234, 0.62);
  --ember: #e8b781;          /* warm highlight on night */
  --electric: #24356e;       /* deep indigo, legacy token */
  --acid: #e8c98b;           /* warm gold, legacy token */

  --gutter: 40px;
  --maxw: 1480px;
  --sec-y: 104px;

  --serif: "Instrument Serif", "Noto Serif KR", serif;
  --sans: "Pretendard Variable", "Pretendard", "Space Grotesk", system-ui, sans-serif;
  --display: "Space Grotesk", "Pretendard Variable", sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bone); color: var(--ink); font-size: 15px; line-height: 1.5; overflow-x: hidden; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--tangerine-deep); }
img { display: block; max-width: 100%; }

.mono { font-family: var(--mono); letter-spacing: 0; }
.display { font-family: var(--display); font-weight: 700; letter-spacing: -0.035em; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 400; }
/* Hangul in display type runs optically larger than Latin — pull it back */
.ko { font-family: var(--sans); font-weight: 800; font-size: 0.94em; letter-spacing: -0.035em; }

.shell { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- Chrome: one live strip ---------- */
.live-bar { background: var(--ink); color: var(--bone); display: flex; align-items: stretch; height: 34px; overflow: hidden; }
.live-bar .status { display: flex; align-items: center; gap: 10px; padding: 0 18px 0 var(--gutter); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-right: 1px solid rgba(246,242,234,0.2); white-space: nowrap; }
.live-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tangerine); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.live-bar .stream { flex: 1; overflow: hidden; display: flex; align-items: center; }
.live-bar .clock { padding: 0 var(--gutter) 0 18px; display: flex; align-items: center; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: rgba(246,242,234,0.6); border-left: 1px solid rgba(246,242,234,0.2); white-space: nowrap; }
.ticker-track { display: flex; gap: 40px; white-space: nowrap; animation: scroll 72s linear infinite; width: max-content; }
.ticker-item { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(246,242,234,0.78); display: flex; align-items: center; gap: 40px; }
.ticker-item .sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(246,242,234,0.35); }
.ticker-item.hot { color: var(--ember); }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--bone); border-bottom: 1px solid var(--line); padding: 0 var(--gutter); height: 68px; display: flex; align-items: center; gap: 36px; }
.brand-mark { display: flex; align-items: baseline; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.045em; }
.brand-mark .glyph { width: 22px; height: 22px; background: var(--ink); color: var(--bone); display: grid; place-items: center; font-family: var(--display); font-size: 14px; font-weight: 700; align-self: center; }
.brand-mark .glyph::after { content: "N"; }
.nav { display: flex; gap: 2px; flex: 1; }
.nav a { padding: 8px 12px; font-size: 14px; font-weight: 500; color: var(--ink-2); transition: color 0.15s, background 0.15s; border-radius: 4px; }
.nav a:hover { color: var(--ink); background: var(--bone-2); }
.nav a.active { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--tangerine); border-radius: 0; }
.search-pill { display: flex; align-items: center; gap: 8px; background: var(--bone-2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 3px; width: 260px; font-size: 13px; color: var(--mute); }
.search-pill svg { flex-shrink: 0; }
.icon-btn { width: 34px; height: 34px; border-radius: 3px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); display: grid; place-items: center; transition: background 0.15s, color 0.15s; }
.icon-btn:hover { background: var(--ink); color: var(--bone); border-color: var(--ink); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sand); border: 1px solid var(--line); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 3px; font-family: var(--sans); font-weight: 600; font-size: 14px; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: background 0.15s, color 0.15s, border-color 0.15s; }
.btn:hover { background: var(--ink); color: var(--bone); }
.btn-primary { background: var(--ink); color: var(--bone); }
.btn-primary:hover { background: var(--tangerine); border-color: var(--tangerine); color: #fff; }
.btn-accent { background: var(--tangerine); border-color: var(--tangerine); color: #fff; }
.btn-accent:hover { background: var(--tangerine-deep); border-color: var(--tangerine-deep); color: #fff; }
.btn-ghost-light { background: transparent; color: var(--bone); border-color: var(--night-line); }
.btn-ghost-light:hover { background: var(--bone); color: var(--ink); border-color: var(--bone); }

/* ---------- Section rhythm ---------- */
.page { min-height: 100vh; }
.section { padding: var(--sec-y) 0; }
.section > .shell > .section-header { margin-bottom: 40px; }
.section-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 40px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 10px; }
.eyebrow .dash { width: 20px; height: 1px; background: currentColor; }
.section-title { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 3.4vw, 50px); line-height: 1.02; letter-spacing: -0.035em; margin: 14px 0 0; }
.section-title em { font-style: normal; color: var(--tangerine); font-family: inherit; font-weight: inherit; }
.section-lede { font-size: 15px; color: var(--ink-2); margin: 14px 0 0; max-width: 460px; }

/* ---------- Hero ---------- */
.hero-edit { display: grid; grid-template-columns: 1.05fr 1fr; border-bottom: 1px solid var(--line); min-height: 76vh; }
.hero-edit .left { padding: 56px var(--gutter) 0; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); position: relative; }
.hero-edit .masthead { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; display: flex; gap: 18px; color: var(--mute); }
.hero-edit .masthead b { color: var(--ink); font-weight: 500; }
.hero-edit h1 { font-family: var(--display); font-weight: 700; font-size: clamp(58px, 7.4vw, 118px); line-height: 0.9; letter-spacing: -0.05em; margin: 40px 0 0; color: var(--ink); }
.hero-edit h1 .ko { font-weight: 800; }
.hero-edit h1 .it { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--tangerine); letter-spacing: -0.02em; }
.hero-edit .sub { font-size: 16px; max-width: 430px; color: var(--ink-2); margin: 26px 0 0; line-height: 1.6; text-wrap: pretty; }
.hero-edit .cta-row { display: flex; gap: 10px; margin-top: 30px; }
.hero-edit .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin-top: 48px; }
.hero-edit .stats div { padding: 20px 0 22px; }
.hero-edit .stats .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
.hero-edit .stats .v { font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -0.035em; margin-top: 4px; }
.hero-edit .right { position: relative; background: var(--night); overflow: hidden; }
.hero-edit .hero-img { position: absolute; inset: 0; background-image: linear-gradient(178deg, #0d1830 0%, #1b2a4c 52%, #56406a 78%, #b4633c 100%); }
.hero-edit .hero-img::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(132deg, rgba(246,242,234,0.05) 0 1px, transparent 1px 9px); }
.hero-edit .caption { position: absolute; bottom: 28px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(246,242,234,0.72); }
.hero-edit .caption b { display: block; color: var(--bone); font-weight: 500; letter-spacing: 0.04em; }

/* ---------- Category strip ---------- */
.cat-strip { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); background: var(--bone); }
.cat-strip .cell { padding: 30px 28px 34px; border-right: 1px solid var(--line); position: relative; cursor: pointer; transition: background 0.2s; }
.cat-strip .cell:last-child { border-right: none; }
.cat-strip .cell:hover { background: var(--bone-2); }
.cat-strip .num { font-family: var(--mono); font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.1em; }
.cat-strip .label { font-family: var(--sans); font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin: 14px 0 8px; }
.cat-strip .count { font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }
.cat-strip .arrow { position: absolute; top: 28px; right: 24px; font-size: 15px; color: var(--mute); opacity: 0; transition: opacity 0.2s, transform 0.2s; }
.cat-strip .cell:hover .arrow { opacity: 1; transform: translate(2px, -2px); }

/* ---------- Card system ---------- */
.media { position: relative; background: var(--sand); overflow: hidden; }
.media.poster { aspect-ratio: 3 / 4; }
.media.wide { aspect-ratio: 4 / 3; }
.media.tall { aspect-ratio: 4 / 5; }
.ph { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(20,19,15,0.055) 0 1px, transparent 1px 8px); }
.ph.warm { background-color: #e3d6c2; background-image: repeating-linear-gradient(135deg, rgba(20,19,15,0.06) 0 1px, transparent 1px 8px); }
.ph.cool { background-color: #cfd3d6; background-image: repeating-linear-gradient(135deg, rgba(20,19,15,0.06) 0 1px, transparent 1px 8px); }
.ph.night { background-color: #1b2a4c; background-image: repeating-linear-gradient(135deg, rgba(246,242,234,0.06) 0 1px, transparent 1px 8px); }
.ph-note { position: absolute; bottom: 12px; left: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(20,19,15,0.45); }
.ph-note.light { color: rgba(246,242,234,0.6); }

/* ---------- Events grid ---------- */
.events { padding: var(--sec-y) 0; border-bottom: 1px solid var(--line); }
.event-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.event-card { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; background: var(--bone); position: relative; transition: background 0.15s; display: flex; flex-direction: column; }
.event-card:hover { background: var(--bone-2); }
.event-card .thumb { aspect-ratio: 3 / 4; background: var(--sand); position: relative; overflow: hidden; }
.event-card .thumb-bg { position: absolute; inset: 0; }
.event-card .thumb-bg.a, .event-card .thumb-bg.e { background: #e3d6c2 repeating-linear-gradient(135deg, rgba(20,19,15,0.06) 0 1px, transparent 1px 8px); }
.event-card .thumb-bg.c, .event-card .thumb-bg.f { background: #dfd8cb repeating-linear-gradient(135deg, rgba(20,19,15,0.06) 0 1px, transparent 1px 8px); }
.event-card .thumb-bg.b, .event-card .thumb-bg.d, .event-card .thumb-bg.g, .event-card .thumb-bg.h { background: #1b2a4c repeating-linear-gradient(135deg, rgba(246,242,234,0.06) 0 1px, transparent 1px 8px); }
.event-card .index-tag { display: none; }
.event-card .heart { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; background: rgba(246,242,234,0.9); border: none; color: var(--ink-2); display: grid; place-items: center; font-size: 13px; transition: background 0.15s, color 0.15s; }
.event-card .heart:hover { background: var(--bone); }
.event-card .heart.active { background: var(--tangerine); color: #fff; }
.event-card .placeholder-cap { position: absolute; bottom: 10px; left: 12px; font-family: var(--mono); font-size: 10px; color: rgba(20,19,15,0.45); text-transform: uppercase; letter-spacing: 0.06em; }
.event-card .placeholder-cap.light { color: rgba(246,242,234,0.6); }
.event-card .body { padding: 16px 16px 18px; flex: 1; display: flex; flex-direction: column; }
.event-card .cat { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--mute); }
.event-card .title { font-family: var(--sans); font-size: 17px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.32; margin: 9px 0 0; flex: 1; text-wrap: pretty; }
.event-card .title .ko { font-size: 1em; }
.event-card .footer-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.event-card .footer-meta .price { color: var(--ink); font-weight: 600; white-space: nowrap; }
.event-card .footer-meta .price.free { color: var(--tangerine-deep); }
.event-card .meta-line { font-family: var(--mono); font-size: 10px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px; }

/* Day pills */
.day-tabs { display: flex; gap: 6px; }
.day-pill { padding: 8px 14px; border-radius: 3px; border: 1px solid var(--line); background: transparent; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); transition: all 0.15s; }
.day-pill:hover { border-color: var(--line-strong); }
.day-pill.active { background: var(--ink); border-color: var(--ink); color: var(--bone); }

/* ---------- Tonight ---------- */
.tonight { background: var(--night); color: var(--bone); position: relative; overflow: hidden; }
.tonight .stars { position: absolute; inset: 0; background: radial-gradient(1px 1px at 18% 16%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 62% 12%, rgba(255,255,255,0.35), transparent), radial-gradient(1px 1px at 84% 26%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 38% 8%, rgba(255,255,255,0.3), transparent); pointer-events: none; }
.tonight .moon { display: none; }
.tonight .section-title { color: var(--bone); }
.tonight .section-title em { color: var(--ember); }
.tonight .eyebrow { color: var(--night-mute); }
.tonight .section-lede { color: var(--night-mute); }
.tonight-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; border-top: 1px solid var(--night-line); border-left: 1px solid var(--night-line); position: relative; }
.night-card { border-right: 1px solid var(--night-line); border-bottom: 1px solid var(--night-line); padding: 20px 20px 24px; position: relative; cursor: pointer; transition: background 0.2s; min-height: 300px; display: flex; flex-direction: column; }
.night-card:hover { background: rgba(246, 242, 234, 0.045); }
.night-card.feature { grid-row: span 2; min-height: 620px; padding: 24px 24px 28px; }
.night-card .index { font-family: var(--mono); font-size: 10px; color: var(--night-mute); letter-spacing: 0.1em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 12px; }
.night-card .img-frame { margin-top: 14px; flex: 1; position: relative; overflow: hidden; background: #1b2a4c; }
.night-card .img-frame::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(246,242,234,0.06) 0 1px, transparent 1px 8px); }
.night-card.feature .img-frame { background: linear-gradient(178deg, #0d1830 0%, #22335c 60%, #7d4a45 100%); }
.night-card .place-label { position: absolute; bottom: 12px; left: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(246,242,234,0.6); z-index: 2; }
.night-card .info { margin-top: 18px; }
.night-card .place-name { font-family: var(--sans); font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
.night-card.feature .place-name { font-size: 40px; line-height: 1.05; letter-spacing: -0.04em; }
.night-card .place-name .ko { font-size: 1em; }
.night-card .en { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--night-mute); margin-top: 6px; }
.night-card .meta { font-family: var(--mono); font-size: 10px; color: var(--night-mute); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.07em; display: flex; gap: 10px; flex-wrap: wrap; }
.night-card .meta .hl { color: var(--ember); }
.night-card .tag-row { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 2px; border: 1px solid var(--night-line); color: inherit; text-transform: uppercase; letter-spacing: 0.06em; }
.tag.solid { background: var(--tangerine); color: #fff; border-color: var(--tangerine); }

/* ---------- Map promo ---------- */
.map-promo { display: grid; grid-template-columns: 1fr 1.1fr; border-bottom: 1px solid var(--line); min-height: 520px; }
.map-promo .left { padding: var(--sec-y) 56px var(--sec-y) var(--gutter); display: flex; flex-direction: column; justify-content: space-between; background: var(--tangerine); color: var(--ink); position: relative; overflow: hidden; }
.map-promo .left .eyebrow { color: var(--ink); }
.map-promo .left .bigtype { font-family: var(--sans); font-size: clamp(38px, 4vw, 58px); font-weight: 800; line-height: 1.06; letter-spacing: -0.04em; margin: 16px 0 0; }
.map-promo .left .bigtype .ko { font-size: 1em; }
.map-promo .left .desc { font-size: 15px; line-height: 1.65; max-width: 400px; margin-top: 20px; color: var(--ink); }
.map-promo .left .btn { border-color: var(--ink); color: var(--ink); }
.map-promo .left .btn:hover { background: var(--ink); color: var(--bone); }
.map-promo .right { position: relative; background: var(--bone-2); overflow: hidden; }
.map-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--ink) 1px, transparent 1px), linear-gradient(90deg, var(--ink) 1px, transparent 1px); background-size: 72px 72px; opacity: 0.06; }
.map-pin { position: absolute; width: 9px; height: 9px; background: var(--ink); border-radius: 50%; cursor: pointer; transition: transform 0.15s; }
.map-pin:hover { transform: scale(1.3); }
.map-pin.big { width: 13px; height: 13px; background: var(--tangerine); box-shadow: 0 0 0 5px rgba(226, 84, 47, 0.18); }
.map-pin.big::after { content: none; }
.map-pin .label { display: none; position: absolute; top: -26px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--ink); color: var(--bone); padding: 3px 7px; }
.map-pin.big .label, .map-pin:hover .label { display: block; }

/* ---------- Curators ---------- */
.curators { padding: var(--sec-y) 0; border-bottom: 1px solid var(--line); }
.curator-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.curator-card { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bone); padding: 28px 28px 30px; border-radius: 0; position: relative; cursor: pointer; transition: background 0.15s; display: flex; flex-direction: column; }
.curator-card:hover { background: var(--bone-2); transform: none; box-shadow: none; }
.curator-card .name { font-family: var(--sans); font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
.curator-card .role { font-family: var(--mono); font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.09em; margin-top: 5px; }
.curator-card .quote { font-family: var(--serif); font-style: normal; font-size: 22px; line-height: 1.45; margin: 26px 0 0; flex: 1; color: var(--ink); text-wrap: pretty; }
.curator-card .picks { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.07em; line-height: 1.7; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-presets="react">
// Shared chrome (v2): one live strip, header, footer

<script type="text/babel" data-presets="react">
// AI 코스추천 리모컨 — square FAB + bubble → input slides left → panel rises up
// Picks ONLY from the page's own data (events · spots · rest stops); unknown ids are dropped.
const { useState: useStateCr, useEffect: useEffectCr, useRef: useRefCr } = React;

const CR_REST = [
  { id: "r1", name: "익선동 골목", area: "종로구", kind: "식사·카페", note: "한옥 골목 카페와 노포" },
  { id: "r2", name: "광장시장", area: "종로구", kind: "식사", note: "빈대떡·육회, 늦게까지 북적" },
  { id: "r3", name: "성수동 카페거리", area: "성동구", kind: "카페", note: "공장 개조 카페, 응봉산과 가까움" },
  { id: "r4", name: "망원시장", area: "마포구", kind: "식사", note: "간단한 시장 먹거리, 한강 도보권" },
  { id: "r5", name: "서촌 골목", area: "종로구", kind: "식사·카페", note: "조용한 골목 식당과 책방" },
  { id: "r6", name: "여의도 더현대 푸드홀", area: "영등포구", kind: "식사", note: "한강공원 바로 옆" },
];

function crCatalog() {
  const D = window.NOLSEOUL_DATA;
  const ev = D.EVENTS.map(e => ({ id: "e" + e.id, type: "EVENT", name: e.title, sub: `${e.cat} · ${e.venue}`, meta: `${e.date} · ${e.price}` }));
  const sp = D.TONIGHT_SPOTS.map(s => ({ id: "s" + s.id, type: "NIGHT", name: s.name, sub: `${s.district} · ${s.en}`, meta: s.time }));
  const rs = CR_REST.map(r => ({ id: r.id, type: "REST", name: r.name, sub: `${r.area} · ${r.kind}`, meta: r.note }));
  return { all: [...ev, ...rs, ...sp], byId: Object.fromEntries([...ev, ...rs, ...sp].map(x => [x.id, x])) };
}

const CR_TYPE_LABEL = { EVENT: "문화행사", REST: "식사·쉬어가기", NIGHT: "야경 마무리" };

function crContextPrefill(activeNav) {
  if (activeNav === "detail") return "2026 은평역사한옥박물관 기획전 보고 나서 ";
  if (activeNav === "night") return "야경으로 마무리하는 ";
  if (activeNav === "map") return "지금 내 주변에서 ";
  return "";
}

function crFallback(query, cat) {
  // deterministic course when AI is unavailable — still only real catalog items
  const q = query;
  const pick = (type, pref) => cat.all.filter(x => x.type === type).find(x => pref.some(p => (x.name + x.sub).includes(p))) || cat.all.find(x => x.type === type);
  const free = /무료/.test(q);
  const ev = q.includes("은평") ? cat.byId.e1 : /재즈|공연|음악/.test(q) ? cat.byId.e8 : free ? cat.byId.e5 : pick("EVENT", ["한강", "전시"]);
  const rest = /성수|응봉/.test(q) ? cat.byId.r3 : /마포|망원|재즈/.test(q) ? cat.byId.r4 : /여의도|한강/.test(q) || ev.id === "e5" ? cat.byId.r6 : cat.byId.r1;
  const night = /성수|응봉/.test(q) ? cat.byId.s5 : /마포|노을/.test(q) || ev.id === "e8" ? cat.byId.s4 : /한강|반포|여의도/.test(q) || ev.id === "e5" ? cat.byId.s2 : cat.byId.s3;
  return {
    title: "오늘의 3스톱 코스",
    stops: [
      { id: ev.id, time: "18:00", why: "조건에 가장 가까운 진행 중 행사로 시작해요." },
      { id: rest.id, time: "19:40", why: "행사 장소에서 이동하기 쉬운 곳에서 쉬어가요." },
      { id: night.id, time: "21:00", why: "일몰 이후 가장 가까운 야경 명소로 마무리해요." },
    ],
    source: "fallback",
  };
}

async function crAskClaude(query, cat) {
  const list = cat.all.map(x => `${x.id} | ${x.type} | ${x.name} | ${x.sub} | ${x.meta}`).join("\n");
  const prompt = `너는 서울 문화 큐레이션 서비스 '놀서울'의 코스 추천 기능이다.
사용자 상황: "${query}"

아래 목록에 있는 항목만 사용해서 3개 정류장 코스를 짠다. 목록에 없는 장소는 절대 만들지 않는다.
순서: EVENT 1개 → REST 1개 → NIGHT 1개.

목록 (id | type | 이름 | 정보 | 일정/메모):
${list}

JSON만 출력:
{"title":"코스 제목(12자 이내)","stops":[{"id":"목록의 id","time":"HH:MM","why":"이 정류장을 고른 이유 한 문장(40자 이내, 사용자 상황과 연결)"}]}`;
  let text = null;
  if (window.claude && typeof window.claude.complete === "function") {
    const r = await window.claude.complete(prompt);
    text = typeof r === "string" ? r : (r && r.text) || "";
  } else if (window.claude && typeof window.claude.use === "function") {
    const sample = await window.claude.use("sample");
    if (!sample) return null;
    const r = await sample(prompt, { modelTier: "quick" });
    text = r.text;
  } else return null;
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) return null;
  const data = JSON.parse(m[0]);
  const stops = (data.stops || []).filter(s => cat.byId[s.id]);   // drop anything not in the catalog
  if (stops.length < 2) return null;
  return { title: data.title || "추천 코스", stops, source: "ai" };
}

const CR_CHIPS = ["오늘 밤 데이트", "친구랑 성수 3시간", "무료로만", "비 와도 OK"];

function CourseRemote({ activeNav, onNav }) {
  const [stage, setStage] = useStateCr("idle"); // idle | input | loading | result
  const [query, setQuery] = useStateCr("");
  const [course, setCourse] = useStateCr(null);
  const [shown, setShown] = useStateCr(0);
  const [err, setErr] = useStateCr("");
  const inputRef = useRefCr(null);
  const cat = React.useMemo(crCatalog, []);

  useEffectCr(() => { if (stage === "input") setTimeout(() => inputRef.current && inputRef.current.focus(), 260); }, [stage]);
  useEffectCr(() => {
    if (stage !== "result" || !course) return;
    if (shown >= course.stops.length) return;
    const id = setTimeout(() => setShown(s => s + 1), 420);
    return () => clearTimeout(id);
  }, [stage, shown, course]);

  const open = () => {
    if (course) { setStage("result"); setShown(course.stops.length); return; }
    setQuery(crContextPrefill(activeNav)); setStage("input");
  };
  const close = () => setStage("idle");

  const submit = async (q) => {
    const text = (q ?? query).trim();
    if (!text) return;
    setQuery(text); setErr(""); setStage("loading"); setShown(0);
    let c = null;
    try { c = await crAskClaude(text, cat); } catch (e) { c = null; }
    if (!c) { c = crFallback(text, cat); setErr("AI 응답을 받지 못해 기본 규칙으로 짠 코스예요."); }
    setCourse(c); setStage("result");
  };

  const swap = (i) => {
    const cur = course.stops[i]; const type = cat.byId[cur.id].type;
    const used = new Set(course.stops.map(s => s.id));
    const pool = cat.all.filter(x => x.type === type && !used.has(x.id));
    if (!pool.length) return;
    const next = pool[Math.floor(Math.random() * pool.length)];
    const stops = course.stops.slice(); stops[i] = { ...cur, id: next.id, why: "직접 바꾼 정류장이에요." };
    setCourse({ ...course, stops });
  };

  const isOpen = stage !== "idle";
  const panelUp = stage === "loading" || stage === "result";

  return (
    <div className={`cr-root ${isOpen ? "open" : ""}`} data-noncommentable="">
      <style>{CR_CSS}</style>

      {/* Panel rises up */}
      <section className={`cr-panel ${panelUp ? "up" : ""}`} aria-hidden={!panelUp}>
        <header className="cr-ph">
          <div>
            <div className="cr-eyebrow"><span className="cr-dash"></span>AI COURSE · 놀서울 큐레이션</div>
            <div className="cr-title">{stage === "loading" ? "코스를 짜는 중…" : (course && course.title)}</div>
            <div className="cr-q">“{query}”</div>
          </div>
          <button className="cr-x" onClick={close} aria-label="닫기">✕</button>
        </header>

        <ol className="cr-stops">
          {[0, 1, 2].map(i => {
            const st = course && stage === "result" && i < shown ? course.stops[i] : null;
            const item = st && cat.byId[st.id];
            return (
              <li key={i} className={`cr-stop ${item ? "filled" : "skeleton"}`}>
                <div className="cr-rail"><span className="cr-num">0{i + 1}</span>{i < 2 && <span className="cr-line"></span>}</div>
                {item ? (
                  <div className="cr-body">
                    <div className="cr-meta"><span>{st.time}</span><span>{CR_TYPE_LABEL[item.type]}</span></div>
                    <div className="cr-name">{item.name}</div>
                    <div className="cr-sub">{item.sub}</div>
                    <div className="cr-why">{st.why}</div>
                    <button className="cr-swap" onClick={() => swap(i)}>↻ 다른 곳으로</button>
                  </div>
                ) : (
                  <div className="cr-body"><div className="cr-sk w40"></div><div className="cr-sk w80"></div><div className="cr-sk w60"></div></div>
                )}
              </li>
            );
          })}
        </ol>

        {stage === "result" && (
          <footer className="cr-pf">
            {err && <div className="cr-note">{err}</div>}
            <div className="cr-actions">
              <button className="cr-btn ghost" onClick={() => { setCourse(null); setStage("input"); }}>다시 짜기</button>
              <button className="cr-btn solid" onClick={() => { onNav && onNav("map"); close(); }}>지도에서 동선 보기 →</button>
            </div>
          </footer>
        )}
      </section>

      {/* Input slides out to the left */}
      <div className={`cr-inputwrap ${stage === "input" ? "out" : ""}`}>
        <form className="cr-input" onSubmit={e => { e.preventDefault(); submit(); }}>
          <input ref={inputRef} value={query} onChange={e => setQuery(e.target.value)}
                 placeholder="예) 토요일 저녁, 친구랑 성수 근처, 3시간" />
          <button type="submit" className="cr-send" aria-label="추천 받기">→</button>
        </form>
        <div className="cr-chips">
          <span className="cr-hint">상황을 설명해주면 코스를 추천해드려요</span>
          {CR_CHIPS.map(c => <button key={c} className="cr-chip" onClick={() => submit((crContextPrefill(activeNav) + c).trim())}>{c}</button>)}
        </div>
      </div>

      {/* Bubble + square button */}
      <div className={`cr-bubble ${isOpen ? "hide" : ""}`}>코스추천</div>
      <button className={`cr-fab ${isOpen ? "active" : ""}`} onClick={isOpen ? close : open} aria-label="AI 코스추천">
        {isOpen ? <span className="cr-fab-x">✕</span> : (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
            <circle cx="6" cy="18" r="2.2" /><circle cx="18" cy="6" r="2.2" />
            <path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8" />
          </svg>
        )}
      </button>
    </div>
  );
}

Object.assign(window, { CourseRemote });

<script type="text/babel" data-presets="react">
// Main app - composes chrome + selected page + tweaks

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "layout": "editorial",
  "accent": "#e2542f",
  "showTicker": true,
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeNav, setActiveNav] = React.useState("home");

  React.useEffect(() => {
    document.documentElement.style.setProperty("--tangerine", tweaks.accent);
  }, [tweaks.accent]);

  // sync hash
  React.useEffect(() => {
    const onHash = () => {
      const h = location.hash.slice(1) || "home";
      setActiveNav(h);
    };
    onHash();
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const navigate = (id) => {
    location.hash = id;
    setActiveNav(id);
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  const renderPage = () => {
    switch (activeNav) {
      case "events": return <EventsPage />;
      case "map": return <MapPage />;
      case "night": return <NightPage />;
      case "stories": return <StoriesPage />;
      case "my": return <MyPage />;
      case "detail": return <DetailPage onBack={() => navigate("home")} />;
      default:
        if (tweaks.layout === "bulletin") return <BulletinLayout />;
        if (tweaks.layout === "index") return <IndexLayout />;
        return <EditorialLayout onDetail={() => navigate("detail")} onNav={navigate} />;
    }
  };

  return (
    <div className="page">
      <LiveBar showStream={tweaks.showTicker && activeNav !== "map"} />
      <Header activeNav={activeNav} setActiveNav={navigate} />
      <main>{renderPage()}</main>
      {activeNav !== "map" && <Footer />}

      <CourseRemote activeNav={activeNav} onNav={navigate} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="페이지">
          <TweakSelect
            label="현재 페이지"
            value={activeNav}
            onChange={navigate}
            options={[
              { value: "home", label: "홈 (랜딩)" },
              { value: "events", label: "문화행사" },
              { value: "map", label: "지도탐색" },
              { value: "night", label: "야경명소" },
              { value: "stories", label: "스토리" },
              { value: "my", label: "마이페이지" },
              { value: "detail", label: "행사 상세" },
            ]}
          />
        </TweakSection>
        {activeNav === "home" && (
          <TweakSection label="홈 레이아웃 변형">
            <TweakSelect
              label="레이아웃"
              value={tweaks.layout}
              onChange={v => setTweak("layout", v)}
              options={[
                { value: "editorial", label: "Editorial — 매거진" },
                { value: "bulletin", label: "Bulletin — 핀 보드" },
                { value: "index", label: "Index — 목록·타이포" },
              ]}
            />
          </TweakSection>
        )}
        <TweakSection label="전역 설정">
          <TweakToggle
            label="상단 티커"
            value={tweaks.showTicker}
            onChange={v => setTweak("showTicker", v)}
          />
          <TweakColor
            label="포인트 컬러"
            value={tweaks.accent}
            onChange={v => setTweak("accent", v)}
            options={["#e2542f", "#b13c1b", "#24356e"]}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
